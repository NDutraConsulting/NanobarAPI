[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "NanobarAPI"
version = "0.1.0"
description = "An opinionated ASGI API framework wrapping Starlette (beta v0.1, Starlette-based build)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "starlette>=0.46.0",
    "sqlalchemy>=2.0",
    "anyio>=4.0",
    "opentelemetry-api>=1.20",
    # Real runtime dependency, not test-only: nanobar_api.middleware.trace.configure_tracing
    # constructs a local, non-exporting SDK TracerProvider so trace capture into this
    # project's own eventbus works when opted into (NANOBAR_TRACING_ENABLED) without any
    # external OTel setup or backend — see that function's docstring for why a real SDK
    # provider, not just the opentelemetry-api's NoOp default, is needed for this.
    "opentelemetry-sdk>=1.20",
    # Real runtime dependency (2026-08-27, regression-brick analysis Phase 4): promoted from
    # the dev-only dependency group -- `regression_brick_analysis_service.py` dispatches HTTP-
    # shaped replay requests over a real `httpx2.Client`, not `starlette.testclient.TestClient`,
    # per `.focusari/2026-08-27-regression-brick-clarification.md` Part 3 (replay targets a
    # persistent shadow deployment over the network). Same package the dev group already pulls
    # in transitively for `TestClient` (`httpx2`, not `httpx` -- see the dev group's own
    # comment), now a direct import too.
    "httpx2>=2.0.0",
]

[project.optional-dependencies]
serve = ["uvicorn>=0.30"]

[project.scripts]
nanobar = "nanobar_api.cli:main"
nanobar-lint-service-boundaries = "nanobar_api.lint:main"

[dependency-groups]
dev = [
    "NanobarAPI[serve]",
    "coverage>=7.8.2",
    "mypy==2.1.0",
    "ruff==0.16.0",
    "pytest==9.1.1",
    # httpx2 was needed here for starlette.testclient.TestClient (real Starlette prefers it
    # over httpx now; see .focusari/nanobarapi-beta-with-starlette-build-plan-and-tasks.md
    # §5.3) -- now a direct main dependency (see [project] dependencies above), pulled in
    # transitively via "NanobarAPI[serve]" above, so no separate pin is needed here anymore.
]

[tool.hatch.build.targets.wheel]
packages = ["nanobar_api"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # https://docs.astral.sh/ruff/rules/#error-e
    "F",      # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "I",      # https://docs.astral.sh/ruff/rules/#isort-i
    "FA",     # https://docs.astral.sh/ruff/rules/#flake8-future-annotations-fa
    "UP",     # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "RUF100", # https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "-rXs --strict-config --strict-markers"
xfail_strict = true

[tool.coverage.run]
branch = true
source_pkgs = ["nanobar_api", "tests"]

[tool.coverage.report]
exclude_also = [
    "@overload",
    "raise NotImplementedError",
]
