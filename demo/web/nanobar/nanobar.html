<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nanobar · NanobarAPI</title>
  <link rel="stylesheet" href="/static/nanobar/nanobar.css" />
</head>
<body>
  <nav class="top-nav">
    <a href="/admin/nanobar/dashboard">Nanobars</a>
    <a href="/admin/nanobar/triage">Triage board</a>
    <a href="/admin/nanobar/traces">Traces</a>
  </nav>

  <div class="page">
    <header class="page-header">
      <p class="back-link"><a href="/admin/nanobar/dashboard">&larr; All nanobars</a></p>
      <h1 id="nanobar-title" class="page-title">Loading nanobar&hellip;</h1>
      <p id="nanobar-subtitle" class="page-subtitle" hidden></p>
    </header>

    <main class="page-main">
      <div id="page-status" class="page-status" hidden></div>

      <section id="summary-section" class="summary-section" hidden aria-labelledby="summary-heading">
        <h2 id="summary-heading" class="section-heading">Nanobar summary</h2>
        <dl id="summary-grid" class="summary-grid"></dl>
        <div id="summary-targets" class="summary-targets"></div>

        <div class="edit-controls" aria-labelledby="edit-controls-heading">
          <h3 id="edit-controls-heading" class="edit-controls-heading">Edit navigation fields</h3>
          <form id="edit-form" class="edit-form">
            <label class="edit-field">
              <span class="edit-field-label">Label</span>
              <input type="text" id="edit-label" name="label" />
            </label>
            <label class="edit-field">
              <span class="edit-field-label">Scenario description</span>
              <textarea id="edit-scenario-description" name="scenario_description" rows="2"></textarea>
            </label>
            <label class="edit-field">
              <span class="edit-field-label">Component source</span>
              <input type="text" id="edit-component-source" name="component_source_description" />
            </label>
            <label class="edit-field">
              <span class="edit-field-label">Domain</span>
              <input type="text" id="edit-domain" name="domain" />
            </label>
            <label class="edit-field">
              <span class="edit-field-label">Criticality (0.0&ndash;1.0)</span>
              <input type="number" id="edit-criticality" name="criticality" min="0" max="1" step="0.05" />
            </label>
            <button type="submit" id="edit-save-btn" class="edit-save-btn">Save</button>
          </form>
          <p id="edit-error" class="edit-error" role="alert" hidden></p>
          <p id="edit-success" class="edit-success" role="status" hidden></p>
        </div>
      </section>

      <section id="coverage-gaps-section" class="coverage-gaps-section" hidden aria-labelledby="coverage-gaps-heading">
        <h2 id="coverage-gaps-heading" class="section-heading">Missing coverage</h2>
        <div id="coverage-gaps-status" class="coverage-gaps-status" hidden></div>
        <div id="coverage-gaps-list" class="coverage-gaps-list" hidden></div>
        <div id="coverage-gaps-empty" class="empty-state" hidden>
          <p class="empty-state-title">Every required scenario for this nanobar type has a bound brick.</p>
        </div>
      </section>

      <section class="bricks-section" aria-labelledby="bricks-heading">
        <h2 id="bricks-heading" class="section-heading">Bound regression bricks</h2>

        <div id="bricks-status" class="bricks-status" hidden></div>

        <div id="bricks-table-wrap" class="bricks-table-wrap" hidden>
          <table id="bricks-table" class="bricks-table">
            <thead>
              <tr>
                <th scope="col">Request</th>
                <th scope="col">Status</th>
                <th scope="col">Content hash</th>
                <th scope="col">Review</th>
              </tr>
            </thead>
            <tbody id="bricks-table-body"></tbody>
          </table>
        </div>

        <div id="bricks-empty" class="empty-state" hidden>
          <p class="empty-state-title">No bricks bound to this nanobar yet</p>
        </div>
      </section>
    </main>
  </div>

  <template id="brick-row-template">
    <tr class="brick-row">
      <td class="brick-request">
        <a class="brick-link">
          <span class="brick-method"></span>
          <span class="brick-path"></span>
        </a>
      </td>
      <td class="brick-status-code"></td>
      <td class="brick-hash"></td>
      <td><span class="review-pill"></span></td>
    </tr>
  </template>

  <script type="module" src="/static/nanobar/nanobar-controller.js"></script>
</body>
</html>
