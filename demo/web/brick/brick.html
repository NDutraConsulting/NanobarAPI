<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brick · NanobarAPI</title>
  <link rel="stylesheet" href="/static/brick/brick.css" />
</head>
<body>
  <nav class="top-nav" aria-label="Primary">
    <a href="/admin/nanobar/dashboard">Nanobars</a>
    <a href="/admin/nanobar/triage">Triage board</a>
    <a href="/admin/nanobar/traces">Traces</a>
  </nav>

  <div class="page">
    <header class="page-header">
      <p class="back-link"><a href="/admin/nanobar/dashboard">&larr; All nanobars</a></p>
      <h1 id="brick-title" class="page-title">Loading brick&hellip;</h1>
      <p id="brick-subtitle" class="page-subtitle" hidden></p>
    </header>

    <main class="page-main">
      <div id="page-status" class="page-status" hidden></div>

      <div id="brick-detail" class="brick-detail" hidden>
        <section class="summary-section" aria-labelledby="summary-heading">
          <div class="summary-top">
            <h2 id="summary-heading" class="section-heading">Brick summary</h2>
            <span id="review-pill" class="review-pill"></span>
          </div>

          <dl id="summary-grid" class="summary-grid">
            <div class="summary-row">
              <dt>Brick ID</dt>
              <dd id="field-brick-id"></dd>
            </div>
            <div class="summary-row">
              <dt>Content hash</dt>
              <dd><code id="field-content-hash" class="code-inline"></code></dd>
            </div>
            <div class="summary-row">
              <dt>Schema version</dt>
              <dd id="field-schema-version"></dd>
            </div>
            <div class="summary-row">
              <dt>Brick version</dt>
              <dd id="field-brick-version"></dd>
            </div>
            <div class="summary-row">
              <dt>Created by</dt>
              <dd id="field-created-by"></dd>
            </div>
            <div class="summary-row">
              <dt>Source</dt>
              <dd id="field-source"></dd>
            </div>
            <div class="summary-row" id="field-scenario-type-row">
              <dt>Scenario type</dt>
              <dd id="field-scenario-type"></dd>
            </div>
          </dl>

          <div class="review-controls" aria-labelledby="review-controls-heading">
            <h3 id="review-controls-heading" class="review-controls-heading">Set review status</h3>
            <div id="review-buttons" class="review-buttons">
              <button type="button" class="review-btn" data-status="new">New</button>
              <button type="button" class="review-btn" data-status="reviewed">Reviewed</button>
              <button type="button" class="review-btn" data-status="flagged">Flagged</button>
              <button type="button" class="review-btn" data-status="promoted">Promoted</button>
            </div>
            <p id="review-error" class="review-error" role="alert" hidden></p>
          </div>

          <div class="scenario-controls" aria-labelledby="scenario-controls-heading">
            <h3 id="scenario-controls-heading" class="scenario-controls-heading">Edit scenario</h3>
            <form id="scenario-form" class="scenario-form">
              <label class="scenario-field">
                <span class="scenario-field-label">Label</span>
                <input type="text" id="scenario-label" name="regression_scenario_label" />
              </label>
              <label class="scenario-field">
                <span class="scenario-field-label">Description</span>
                <textarea id="scenario-description" name="description" rows="2"></textarea>
              </label>
              <button type="submit" id="scenario-save-btn" class="scenario-save-btn">Save</button>
            </form>
            <p id="scenario-error" class="scenario-error" role="alert" hidden></p>
            <p id="scenario-success" class="scenario-success" role="status" hidden></p>
          </div>

          <div class="tags-controls" aria-labelledby="tags-controls-heading">
            <h3 id="tags-controls-heading" class="tags-controls-heading">Tags</h3>
            <ul id="tags-list" class="tags-list"></ul>
            <form id="tag-add-form" class="tag-add-form">
              <input type="text" id="tag-add-input" placeholder="Add a tag" />
              <button type="submit" id="tag-add-btn" class="tag-add-btn">Add</button>
            </form>
            <p id="tags-error" class="tags-error" role="alert" hidden></p>
          </div>
        </section>

        <section class="payload-section" aria-labelledby="request-heading">
          <h2 id="request-heading" class="section-heading">Request</h2>
          <pre id="request-json" class="json-block"></pre>
        </section>

        <section class="payload-section" aria-labelledby="response-heading">
          <h2 id="response-heading" class="section-heading">Response</h2>
          <pre id="response-json" class="json-block"></pre>
        </section>
      </div>
    </main>
  </div>

  <template id="tag-chip-template">
    <li class="tag-chip">
      <span class="tag-chip-text"></span>
      <button type="button" class="tag-chip-remove" aria-label="Remove tag">&times;</button>
    </li>
  </template>

  <script type="module" src="/static/brick/brick-controller.js"></script>
</body>
</html>
